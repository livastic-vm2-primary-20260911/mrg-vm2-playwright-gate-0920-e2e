scopes:
  source:
    files:
      r74_queued:
        include:
        - vm2-r74-root69-marker.txt
merge_queue:
  queued_label: queued
  dequeued_label: dequeued
  max_parallel_checks: 1
queue_rules:
- name: default
  merge_method: merge
  batch_size: 1
  checks_timeout: null
  queue_conditions: []
  merge_conditions:
  - check-success = vm2-r74-root69-never-green-check
pull_request_rules:
- name: VM2_R74_R69_B_AUTOQUEUE_NORMAL
  conditions:
  - author = onecursor3-gif
  - title = VM2_R74_ROOT69_B_READER_QUEUEDLABEL_OWNER_DEQUEUE_261014
  - base = vm2-r74-root69-victim-261014
  - -mergify-configuration-changed
  actions:
    queue:
      name: default
- name: VM2_R74_R69_POST_DEQUEUE_STALE_QUEUED_LABEL_OWNER_DENY
  conditions:
  - author = onecursor3-gif
  - title = VM2_R74_ROOT69_B_READER_QUEUEDLABEL_OWNER_DEQUEUE_261014
  - base = vm2-r74-root69-victim-261014
  - -mergify-configuration-changed
  - label = queued
  - -queue-name = default
  - queue-dequeue-reason = pr-manually-dequeued
  actions:
    merge:
      method: merge
