scopes:
  source:
    files:
      root62_normal:
        include:
        - vm2-root62-normal/**
queue_rules:
- name: root62-normal
  merge_method: merge-batch
  batch_size: 2
  batch_max_wait_time: 10 min
  checks_timeout: null
  allow_queue_branch_edit: false
  queue_conditions: []
  merge_conditions:
  - check-success = vm2-r67-holdnever
pull_request_rules:
- name: VM2_R67_ROOT62_OWNER_STANDING_NORMAL_BRANCH_QUEUE
  conditions:
  - base = vm2-r67-root62-protected-genb
  actions:
    queue:
      name: root62-normal
