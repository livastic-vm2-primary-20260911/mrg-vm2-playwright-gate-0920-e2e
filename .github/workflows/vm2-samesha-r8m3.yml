name: VM2 same-SHA scope writer R8M3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  write-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Prove CI key account and cross-tenant boundary
        env:
          MERGIFY_TOKEN: ${{ secrets.MERGIFY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          app_status=$(curl -sS -o /tmp/app.json -w '%{http_code}' -H 'Accept: application/json' -H "Authorization: Bearer ${MERGIFY_TOKEN}" https://api.mergify.com/v1/application)
          echo "APPLICATION_STATUS=${app_status}"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/app.json'))
          print(json.dumps({k:d.get(k) for k in ('id','name','scope','account_scope')},sort_keys=True))
          PY
          test "$app_status" = 200
          direct_status=$(curl -sS -o /tmp/direct-b.json -w '%{http_code}' -X PUT -H 'Content-Type: application/json' -H "Authorization: Bearer ${MERGIFY_TOKEN}" --data '{"scopes":["vm2-cross-tenant-r8m3"],"all_scopes":false}' https://api.mergify.com/v1/repos/vm2-billing-checkout-v7m3-260916/mrg-vm2-samesha-bind-0923-r8m3/commits/f2d8015837dff36a838c10d2fdf48c42f2b095e4/scopes)
          echo "DIRECT_B_STATUS=${direct_status}"
          test "$direct_status" = 403
          source_status=$(curl -sS -o /tmp/source-a.json -w '%{http_code}' -X PUT -H 'Content-Type: application/json' -H "Authorization: Bearer ${MERGIFY_TOKEN}" --data '{"scopes":["vm2-cross-tenant-r8m3"],"all_scopes":false}' https://api.mergify.com/v1/repos/livastic-vm2-primary-20260911/mrg-vm2-playwright-gate-0920-e2e/commits/f2d8015837dff36a838c10d2fdf48c42f2b095e4/scopes)
          echo "SOURCE_A_STATUS=${source_status}"
          test "$source_status" = 204
