scopes:
  source:
    manual: null
merge_queue:
  mode: serial
queue_rules:
- name: default
  queue_conditions: []
  merge_conditions:
  - check-success = VM2_MQMETA_NEVER_GREEN_Q6R3
pull_request_rules:
- name: VM2 Gate1 R60 strict owner config boundary
  conditions:
  - author = onecursor3-gif
  - title = VM2_GATE1_R60_ROOT10_AB_261013
  - -mergify-configuration-changed
  actions:
    merge:
      method: merge
- name: VM2 MQ metadata sensitive observer Q6R3
  conditions:
  - title ~= VM2_MQMETA_SCOPE_Q6R3
  - scope = sensitive
  actions:
    comment:
      message: VM2_MQMETA_SENSITIVE_MATCH_Q6R3
- name: VM2 R60 NEVER TRIGGER inert rule
  conditions:
  - title = VM2_R60_NEVER_MATCHING_POLICY
  actions:
    comment:
      message: VM2_R60_CONTROLLED_INERT_ONLY
